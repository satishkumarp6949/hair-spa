<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | GoldScissors Salon & Barber</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AOS Animation -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #111, #222);
      color: #fff;
      margin: 0;
    }

    /* Navbar */
    .navbar {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    .navbar-brand, .navbar-nav .nav-link {
      color: #FFD700 !important;
      font-weight: 700;
    }
    .navbar-nav .nav-link:hover {
      color: #fff !important;
      text-shadow: 0 0 10px #FFD700;
    }
html,body{
    overflow-x: hidden;
}
    /* Hero Section */
    .hero {
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('images/spark.jpg') center/cover no-repeat;
      position: relative;
    }
    .hero::after {
      content: '';
      position: absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #FFD700;
    }

    /* Gallery Section */
    .gallery {
      padding: 80px 0;
      max-width: 1200px;
      margin: auto;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.1);
    }
    .gallery-item:hover {
      box-shadow: 0 15px 30px rgba(255,215,0,0.5);
    }

.gallery-item {
  overflow: hidden;
  border-radius: 15px;
}

.gallery-item img {
  width: 100%;
  height: 250px; /* Set all images to same height */
  object-fit: cover; /* Makes the image cover the container without distortion */
  transition: transform 0.3s ease;
}

.gallery-item img:hover {
  transform: scale(1.05); /* Optional hover zoom effect */
}


    /* Footer */
    footer {
      background: #000;
      color: #FFD700;
      padding: 40px 0;
      text-align: center;
    }
    footer a {
      color: #FFD700;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      text-shadow: 0 0 10px #FFD700;
    }

    /* Responsive */
    @media (max-width: 450px) {
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

   <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">GoldScissors</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content" data-aos="fade-up">
      <h1>Gallery</h1>
    </div>
  </section>

  <!-- Gallery Section -->
  <section class="gallery py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
          <div class="gallery-item">
            <img src="images/hair7.jpg" alt="Gallery 1">
          </div>
        </div>
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="200">
          <div class="gallery-item">
            <img src="images/hair8.jpg" alt="Gallery 2">
          </div>
        </div>
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="300">
          <div class="gallery-item">
            <img src="images/hair9.jpg" alt="Gallery 3">
          </div>
        </div>
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="400">
          <div class="gallery-item">
            <img src="images/hair4.jpg" alt="Gallery 4">
          </div>
        </div>
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="500">
          <div class="gallery-item">
            <img src="images/hair10.webp" alt="Gallery 5">
          </div>
        </div>
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="600">
          <div class="gallery-item">
            <img src="images/hair11.avif" alt="Gallery 6">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 GoldScissors Salon & Barber. All Rights Reserved.</p>
    <p>Follow us: <a href="#">Instagram</a> | <a href="#">Facebook</a> | <a href="#">Twitter</a></p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1200,
      once: true,
    });
  </script>

</body>
</html>

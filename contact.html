<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | GoldScissors Salon & Barber</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AOS Animation -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #111, #222);
      color: #fff;
      margin: 0;
    }

    /* Navbar */
    .navbar {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    .navbar-brand, .navbar-nav .nav-link {
      color: #FFD700 !important;
      font-weight: 700;
    }
    .navbar-nav .nav-link:hover {
      color: #fff !important;
      text-shadow: 0 0 10px #FFD700;
    }
html,body{
    overflow-x: hidden;
}
    /* Hero Section */
    .hero {
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('images/contact.jpg') center/cover no-repeat;
      position: relative;
    }
    .hero::after {
      content: '';
      position: absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #FFD700;
    }

    /* Contact Form Section */
    .contact-section {
      padding: 80px 20px;
      max-width: 700px;
      margin: auto;
    }
    .contact-section h2 {
      text-align: center;
      color: #FFD700;
      margin-bottom: 50px;
    }
    .contact-form {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 5px 30px rgba(255,215,0,0.2);
    }
    .contact-form .form-control {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .contact-form .form-control::placeholder {
      color: #ccc;
    }
    .contact-form .btn {
      background: linear-gradient(45deg, #FFD700, #FFA500);
      border: none;
      font-weight: 600;
      width: 100%;
      padding: 12px;
    }
    .contact-form .btn:hover {
      transform: scale(1.05);
      transition: all 0.3s;
    }

    /* Footer */
    footer {
      background: #000;
      color: #FFD700;
      padding: 40px 0;
      text-align: center;
    }
    footer a {
      color: #FFD700;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      text-shadow: 0 0 10px #FFD700;
    }

    @media (max-width: 450px) {
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">GoldScissors</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content" data-aos="fade-up">
      <h1>Contact Us</h1>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-section" data-aos="fade-up">
    <h2>Get in Touch</h2>
    <form class="contact-form">
      <input type="text" class="form-control" placeholder="Your Name" required>
      <input type="email" class="form-control" placeholder="Your Email" required>
      <input type="text" class="form-control" placeholder="Subject" required>
      <textarea class="form-control" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit" class="btn btn-lg">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 GoldScissors Salon & Barber. All Rights Reserved.</p>
    <p>Follow us: <a href="#">Instagram</a> | <a href="#">Facebook</a> | <a href="#">Twitter</a></p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1200,
      once: true,
    });
  </script>
</body>
</html>
